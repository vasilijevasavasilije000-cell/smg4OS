# smg4OS GRUB Bootloader Configuration\n\n### BEGIN /etc/default/grub ###\nGRUB_DEFAULT=0\nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR=\"smg4OS\"\nGRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"\nGRUB_CMDLINE_LINUX=\"\"\n\n### Uncomment for debug output ###\n# GRUB_CMDLINE_LINUX=\"debug\"\n# GRUB_CMDLINE_LINUX_DEFAULT=\"debug\"\n\n### Resolution and gfxmode ###\nGRUB_GFXMODE=1024x768\nGRUB_GFXPAYLOAD_LINUX=keep\n\n### Theme ###\n# GRUB_THEME=\"/boot/grub/themes/smg4/theme.txt\"\n\n### Uncomment to disable automatic memory map detection ###\n# GRUB_DISABLE_LINUX_MEMMAP=true\n\n### Uncomment for recovery mode ###\n# GRUB_DISABLE_RECOVERY=\"false\"\n\n### END /etc/default/grub ###\n\n# Build GRUB config with:\n# sudo grub-mkconfig -o /boot/grub/grub.cfg\n"